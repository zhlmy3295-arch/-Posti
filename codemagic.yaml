workflows:
  posti-android:
    name: Posti Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        ANDROID_KEYSTORE_NAME: posti_key
    scripts:
      - name: Clean Install
        script: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install @capacitor/android@6.2.2 @capacitor/core@6.2.2
      - name: Build Web App
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Fix Gradle Wrapper
        script: |
          cd android
          ./gradlew --version || gradle wrapper
          chmod +x ./gradlew
      - name: Build and Sign APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - zhlmy3295@gmail.com
