workflows:
  posti-android:
    name: Posti Android
    instance_type: mac_mini_m1
    max_build_duration: 60
    
    environment:
      vars:
        ANDROID_KEYSTORE_PATH: $CM_KEYSTORE_PATH
        ANDROID_KEYSTORE_PASSWORD: $CM_KEYSTORE_PASSWORD
        ANDROID_KEY_ALIAS: $CM_KEY_ALIAS
        ANDROID_KEY_PASSWORD: $CM_KEY_PASSWORD
        
    scripts:
      - name: Install Node dependencies
        script: npm install --legacy-peer-deps
          
      - name: Build Web App
        script: npm run build
          
      - name: Sync Capacitor
        script: npx cap sync android
          
      - name: Fix Gradle Wrapper
        script: |
          cd android
          rm -rf .gradle gradle/wrapper
          gradle wrapper --gradle-version 8.2
          
      - name: Fix Android Configs to SDK 35
        script: |
          cd android
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # نعدل الملف الموجود بسطرين بس
          sed -i '' 's/compileSdkVersion [0-9]*/compileSdkVersion 35/' app/build.gradle
          sed -i '' 's/targetSdkVersion [0-9]*/targetSdkVersion 35/' app/build.gradle
          
          # نضيف namespace لو مش موجود
          grep -q namespace app/build.gradle || sed -i '' '2a\    namespace "io.capacitor.posti"' app/build.gradle
          
      - name: Build Android APK Release
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          echo "--- APK LOCATION ---"
          find app/build/outputs -name "*.apk"
          
    artifacts:
      - android/app/build/outputs/apk/release/*.apk   
