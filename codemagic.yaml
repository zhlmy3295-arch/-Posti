workflows:
  posti-android:
    name: Posti Android
    instance_type: mac_mini_m1
    
    environment:
      node: 20
      vars:
        ANDROID_KEYSTORE_PATH: $CM_KEYSTORE_PATH
        ANDROID_KEYSTORE_PASSWORD: $CM_KEYSTORE_PASSWORD
        ANDROID_KEY_ALIAS: $CM_KEY_ALIAS
        ANDROID_KEY_PASSWORD: $CM_KEY_PASSWORD
        
    scripts:
      - name: Install dependencies
        script: npm ci
      
      - name: Build web
        script: npm run build
      
      - name: Sync Capacitor
        script: npx cap sync android
      
      - name: Build APK
        script: cd android && ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
