workflows:
  posti-android:
    name: Posti Android Build
    instance_type: mac_mini_m1
    scripts:
      - name: Install
        script: |
          npm install --legacy-peer-deps
          npx cap sync android
      - name: Build APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
