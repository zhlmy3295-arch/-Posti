workflows:
  posti-android:
    name: Posti Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        CM_KEYSTORE_PASSWORD: 123456
        CM_KEY_ALIAS: upload
        CM_KEY_PASSWORD: 123456
    scripts:
      - name: Clean Install
        script: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install @capacitor/android@latest
      - name: Build Web App
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Delete Corrupt Gradle Wrapper
        script: |
          cd android
          rm -rf gradle
      - name: Build Android APK with Gradle
        script: |
          cd android
          gradle assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
