workflows:
  posti-android:
    name: Posti Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        CM_KEYSTORE_PASSWORD: 123456
        CM_KEY_ALIAS: upload
        CM_KEY_PASSWORD: 123456
    scripts:
      - name: Clean Install
        script: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
          npm install @capacitor/android@6.2.2 @capacitor/core@6.2.2
      - name: Build Web App
        script: npm run build
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Fix Gradle Wrapper
        script: |
          cd android
          ./gradlew --version || gradle wrapper
          chmod +x ./gradlew
      - name: Build and Sign APK
        script: |
          cd android
          ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$CM_KEYSTORE_PATH \
          -Pandroid.injected.signing.store.password=$CM_KEYSTORE_PASSWORD \
          -Pandroid.injected.signing.key.alias=$CM_KEY_ALIAS \
          -Pandroid.injected.signing.key.password=$CM_KEY_PASSWORD
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
