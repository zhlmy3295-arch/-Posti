apply plugin: 'com.android.application'

android {
    namespace "io.ionic.starter"
    compileSdk 34
    defaultConfig {
        applicationId "io.ionic.starter"
        minSdk 24  // بقى 24 بدل 22
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // بقى 17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":capacitor-android")
    // خلاص مفيش capacitor-cordova-android-plugins لوحده
}
